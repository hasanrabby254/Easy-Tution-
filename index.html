      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          if (!target) return;
          var nativeFetch = target.fetch;
          var activeFetch = nativeFetch ? (typeof nativeFetch.bind === 'function' ? nativeFetch.bind(target) : nativeFetch) : null;
          var proto = typeof Window !== 'undefined' ? Window.prototype : null;

          function install(obj) {
            if (!obj) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(obj, 'fetch');
              if (!desc || !desc.set) {
                Object.defineProperty(obj, 'fetch', {
                  get: function() {
                    return activeFetch || (nativeFetch ? (typeof nativeFetch.bind === 'function' ? nativeFetch.bind(target) : nativeFetch) : undefined);
                  },
                  set: function(val) {
                    activeFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }

          if (proto) install(proto);
          install(target);
        } catch (_) {}
      })();
    </script>
